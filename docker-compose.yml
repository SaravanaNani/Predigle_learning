version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: dtrack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dtrack
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: dtrack

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack"]
      interval: 10s
      timeout: 5s
      retries: 10

  dependency-track:
    image: dependencytrack/apiserver:4.13.0
    container_name: dependency-track

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8080"

    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://postgres:5432/dtrack
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: dtrack
      ALPINE_DATABASE_PASSWORD: dtrack
      LOGGING_LEVEL_ROOT: INFO

    volumes:
      - dependency-track-data:/data

  frontend:
    image: dependencytrack/frontend:4.13.0
    container_name: dependency-track-frontend

    restart: unless-stopped

    depends_on:
      - dependency-track

    ports:
      - "8080:8080"

    environment:
      API_BASE_URL: http://localhost:8081

volumes:
  postgres-data:
  dependency-track-data: